name: Build RideMesh APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build vc84 debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo.jpg.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo.jpg
          base64 -d branding/ridemesh_icon.jpg.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon.jpg
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Upload vc84 APK
        id: apk_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-vc84-Rider-Pillion
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp build.log dist/last-build.txt 2>/dev/null || echo "Build ended before Gradle output" > dist/last-build.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/RideMesh-vc84-Rider-Pillion.apk
            echo "" >> dist/last-build.txt
            echo "RESULT: APK_BUILT" >> dist/last-build.txt
          else
            echo "" >> dist/last-build.txt
            echo "RESULT: BUILD_FAILED" >> dist/last-build.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/last-build.txt
          if [ -f dist/RideMesh-vc84-Rider-Pillion.apk ]; then git add dist/RideMesh-vc84-Rider-Pillion.apk; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish vc84 Rider Pillion build result [skip ci]"
            git push
          fi
